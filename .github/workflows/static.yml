# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # Generate Blog Index
      # ==========================================================

      - name: Generate blog posts index
        shell: bash
        run: |

          python3 <<'PY'

          import os
          import re
          import json

          BLOG_DIR = "blog"
          OUTPUT_FILE = os.path.join(BLOG_DIR, "posts.json")

          posts = []

          print("========================================")
          print("Generating blog posts index")
          print("========================================")

          if not os.path.isdir(BLOG_DIR):
              print("Blog directory does not exist.")
              os.makedirs(BLOG_DIR, exist_ok=True)

          for filename in os.listdir(BLOG_DIR):

              if not filename.lower().endswith(".md"):
                  continue

              filepath = os.path.join(BLOG_DIR, filename)

              print(f"Reading: {filepath}")

              with open(
                  filepath,
                  "r",
                  encoding="utf-8"
              ) as f:

                  content = f.read()

              metadata = {}

              # --------------------------------------------------
              # Parse front matter
              # --------------------------------------------------

              if content.startswith("---"):

                  match = re.match(
                      r"^---\s*\n(.*?)\n---",
                      content,
                      re.DOTALL
                  )

                  if match:

                      front_matter = match.group(1)

                      for line in front_matter.splitlines():

                          if ":" not in line:
                              continue

                          key, value = line.split(":", 1)

                          key = key.strip()
                          value = value.strip()

                          if (
                              len(value) >= 2
                              and value[0] == value[-1]
                              and value[0] in ['"', "'"]
                          ):

                              value = value[1:-1]

                          metadata[key] = value

              posts.append({
                  "filename": filename,
                  "title_zh": metadata.get(
                      "title_zh",
                      ""
                  ),
                  "title_en": metadata.get(
                      "title_en",
                      ""
                  ),
                  "date": metadata.get(
                      "date",
                      ""
                  ),
                  "description_zh": metadata.get(
                      "description_zh",
                      ""
                  ),
                  "description_en": metadata.get(
                      "description_en",
                      ""
                  )
              })


          # ------------------------------------------------------
          # Sort newest first
          # ------------------------------------------------------

          posts.sort(
              key=lambda post: post.get(
                  "date",
                  ""
              ),
              reverse=True
          )


          # ------------------------------------------------------
          # Write posts.json
          # ------------------------------------------------------

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  posts,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("========================================")
          print(f"Generated: {OUTPUT_FILE}")
          print(f"Found {len(posts)} Markdown posts.")
          print("========================================")

          PY


      # ==========================================================
      # Verify Blog Index
      # ==========================================================

      - name: Verify blog posts index
        run: |

          echo "========================================"
          echo "Blog directory"
          echo "========================================"

          ls -la blog


          echo ""
          echo "========================================"
          echo "Generated posts.json"
          echo "========================================"

          cat blog/posts.json


      # ==========================================================
      # Setup Pages
      # ==========================================================

      - name: Setup Pages
        uses: actions/configure-pages@v5


      # ==========================================================
      # Upload artifact
      # ==========================================================

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'


      # ==========================================================
      # Deploy to GitHub Pages
      # ==========================================================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
