# Simple workflow for deploying static content to Pages

name: Deploy static content to Pages - BLOG TEST

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # Generate Blog HTML
      # ==========================================

      - name: Generate Blog HTML
        run: |
          echo "===== BEFORE ====="
          ls -la blog
      
          echo "===== GENERATE ====="
          python3 scripts/generate-blog.py
      
          echo "===== AFTER ====="
          ls -la blog
      
          echo "===== GENERATED HTML ====="
          find blog -maxdepth 1 -type f -name "*.html" -print


      # ==========================================
      # GitHub Pages
      # ==========================================

      - name: Setup Pages
        uses: actions/configure-pages@v5


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'


      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
